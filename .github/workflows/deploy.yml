name: Deploy DNS

on:
  push:
    branches:
      - main
    paths:
      - "domains/**"
      - "config/**"
      - "schema/**"
      - "utils/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes to Cloudflare
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-dns
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:ci

      - name: Validate registry
        run: npm run validate

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Preview DNS changes
        if: github.event_name == 'workflow_dispatch' && inputs.apply != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: npm run deploy -- --dry-run

      - name: Apply DNS changes
        if: github.event_name == 'push' || inputs.apply == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: npm run deploy -- --apply --backup deploy-artifacts/cloudflare-before.json

      - name: Upload DNS backup
        if: always() && (github.event_name == 'push' || inputs.apply == true)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudflare-dns-before
          path: deploy-artifacts/cloudflare-before.json
          if-no-files-found: warn
