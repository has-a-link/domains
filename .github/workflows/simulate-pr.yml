name: Simulate PR

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Simulation scenario
        required: true
        default: all
        type: choice
        options:
          - all
          - valid
          - invalid-record
          - owner-mismatch
          - template-incomplete
          - formatting
          - deletion
          - merge-conflict

permissions:
  contents: read

jobs:
  simulate:
    name: Simulate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run simulator
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: npm run simulate:pr -- --scenario "$SCENARIO" --summary "$GITHUB_STEP_SUMMARY"
