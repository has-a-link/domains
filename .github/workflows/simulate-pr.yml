name: Simulate PR

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Simulation scenario
        required: true
        default: all
        type: choice
        options:
          - all
          - valid
          - invalid-record
          - owner-mismatch
          - template-incomplete
          - formatting
          - deletion
          - merge-conflict

permissions:
  contents: read

jobs:
  simulate:
    name: Simulate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run simulator
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: npm run simulate:pr -- --scenario "$SCENARIO" --summary "$GITHUB_STEP_SUMMARY"
