name: Prettier

on:
  schedule:
    - cron: "0 0 * * 0"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prettier
  cancel-in-progress: false

jobs:
  prettify:
    name: Prettify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format repository
        run: npm run format

      - name: Run tests
        run: npm run test:ci

      - name: Create formatting pull request
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.email "bot@has-a.link"
          git config user.name "has-a-link-bot"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi

          BRANCH="chore/prettier-$(date +%s)"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore: format repository"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: format repository" \
            --body-file messages/maintenance/prettier-pr.md
