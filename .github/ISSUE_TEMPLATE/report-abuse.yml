name: Report abuse
description: Report an abusive or policy-violating subdomain.
title: "[Abuse]: "
labels: ["report-abuse"]
body:
  - type: markdown
    attributes:
      value: |
        Provide specific evidence. Reports without enough detail may be closed.
  - type: input
    id: subdomain
    attributes:
      label: Subdomain
      description: The full subdomain.
      placeholder: example.has-a.link
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why this domain violates the rules.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: Add links, screenshots, or other evidence.
    validations:
      required: true
